plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - ".git/**/*"
    - "docs/**/*"
    - "gemfiles/*"
    - "vendor/**/*"
#
# RuboCop built-in settings.
#   For documentation on all settings see: https://docs.rubocop.org/en/stable
#

# Trailing periods.
Layout/DotPosition:
  EnforcedStyle: trailing

# Turn on auto-correction of equals alignment.
Layout/EndAlignment:
  AutoCorrect: true

# Prevent accidental windows line endings
Layout/EndOfLine:
  EnforcedStyle: lf

# Use a table layout for hashes
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# Soften limits
Layout/LineLength:
  Max: 128
  Exclude:
    - "**/test/**/*"

# Match existing layout
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

# cli.rb is excluded from the Metrics cops below for the same reason it is already excluded from
# Metrics/BlockLength: `parser` is a flat run of twenty `opts.on` declarations and `run!` is the
# subcommand dispatch. Both are long because they enumerate the CLI, not because they are complex.

# TODO: Soften Limits for phase 1 only
Metrics/AbcSize:
  Max: 40
  Exclude:
    - "**/*/cli.rb"

# Support long block lengths for tests
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "**/*/cli.rb"
  AllowedMethods:
    - "aasm"
    - "included"

# Soften limits
Metrics/ClassLength:
  Max: 250
  Exclude:
    - "test/**/*"
    - "**/*/cli.rb"

# TODO: Soften Limits for phase 1 only
Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - "**/*/cli.rb"

# Soften limits
Metrics/MethodLength:
  Max: 50
  Exclude:
    - "**/*/cli.rb"

# Soften limits
Metrics/ModuleLength:
  Max: 250

Metrics/ParameterLists:
  CountKeywordArgs: false

# TODO: Soften Limits for phase 1 only
Metrics/PerceivedComplexity:
  Max: 21

# lib/symmetric-encryption.rb is a deliberate alias for lib/symmetric_encryption.rb, so that
# `gem "symmetric-encryption"` can be required under either spelling.
Naming/FileName:
  Exclude:
    - "lib/symmetric-encryption.rb"

# Initialization Vector abbreviation
Naming/MethodParameterName:
  AllowedNames: ['iv', '_', 'io', 'ap']

# Many tests verify several related properties of one round-trip, which is the
# clearer way to write them here. Splitting them by assertion count would not help.
Minitest/MultipleAssertions:
  Enabled: false

# The two `default` tasks are in mutually exclusive branches of an if.
Rake/DuplicateTask:
  Exclude:
    - "Rakefile"

# Does not allow Symbols to load
Security/YAMLLoad:
  AutoCorrect: false

# Needed for testing DateTime
Style/DateTime:
  Exclude: ["test/**/*"]

# TODO: Soften Limits for phase 1 only
Style/Documentation:
  Enabled: false

# One line methods
Style/EmptyMethod:
  EnforcedStyle: expanded

# Ruby 3 compatibility feature
Style/FrozenStringLiteralComment:
  Enabled: false

Style/NumericPredicate:
  AutoCorrect: true

# Incorrectly changes job.fail to job.raise
Style/SignalException:
  Enabled: false

# Since English may not be loaded, cannot force its use.
Style/SpecialGlobalVars:
  Enabled: false

# Make it easier for developers to move between Elixir and Ruby.
Style/StringLiterals:
  EnforcedStyle: double_quotes
